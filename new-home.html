<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>慈惠道場 — 新首頁（試做）</title>
    <meta name="description" content="慈惠道場，主祀瑤池金母。新首頁試做：從凡間升入無邊的道場，鳳凰飛過，經文光簾從天上降下。" />
    <!-- 還在試做，先不給搜尋引擎收錄；使用者看過、選好以後才取代 index.html -->
    <meta name="robots" content="noindex" />
    <!-- 開場要怎麼開始，在畫面出來之前就決定（跟 js/opening.js 的 openingMode 一樣，測試確認）：
         play 播影片（一打開就是第一格，不會先閃一下最後一格）、end 這次看過了、still 要求減少動畫 -->
    <script>
      (function () {
        var root = document.documentElement;
        var seen = false;
        try {
          seen = sessionStorage.getItem("cihui-opening-seen") === "1";
        } catch (e) {}
        var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
        root.dataset.opening = reduce ? "still" : seen ? "end" : "play";
        if (root.dataset.opening === "play") {
          // 網路慢：第一格先下載（最後一格晚一點沒關係）
          var link = document.createElement("link");
          link.rel = "preload";
          link.as = "image";
          link.href = "assets/opening/opening-first.webp";
          link.fetchPriority = "high";
          document.head.appendChild(link);
          // 程式 8 秒內都沒開始（很舊的瀏覽器讀不懂、檔案載不到）：換成最後一格，不要卡在第一格
          setTimeout(function () {
            if (!root.dataset.openingReady) root.dataset.opening = "end";
          }, 8000);
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 只載這一頁用得到的字：選單的黑體、光簾（600）和品牌（900）的宋體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="pages.css" />
    <link rel="stylesheet" href="new-home.css" />
  </head>
  <body>
    <h1 class="sr-only">慈惠道場</h1>
    <!-- 第一個按 Tab 就到它；按 Esc 也可以略過 -->
    <button type="button" class="opening-skip" id="openingSkip" aria-label="略過開場影片" aria-keyshortcuts="Escape" hidden>略過</button>

    <header class="topbar">
      <nav class="pill" aria-label="主選單">
        <a class="brand" href="new-home.html">慈惠道場</a>
        <a href="about.html">關於道場</a>
        <a href="events.html">法會活動</a>
        <a href="services.html">服務</a>
        <a href="gallery.html">相簿</a>
      </nav>
    </header>

    <!-- 開場：影片（從稻田升入道場、鳳凰飛過）播完淡成最後一格；鳳凰飛走以後，經文光簾從天上降下來（js/opening-view.js） -->
    <main class="opening" id="opening">
      <img
        class="opening-still"
        src="assets/opening/opening-last.webp"
        fetchpriority="low"
        alt="無邊的道場：一層層木框沿著長軸通向神壇，兩旁是點亮的光明燈，鏡面地板倒映著雲，遠處是雪山與湖。"
      />
      <video class="opening-video" id="openingVideo" muted playsinline preload="auto" aria-hidden="true"></video>
      <canvas class="opening-curtain" id="openingCurtain" aria-hidden="true"></canvas>
    </main>

    <!-- 程式檔案載不到：直接是最後一格；不支援這種程式的舊瀏覽器也一樣 -->
    <script type="module" src="js/opening-view.js" onerror="document.documentElement.dataset.opening = 'end'"></script>
    <script nomodule>
      document.documentElement.dataset.opening = "end";
    </script>
  </body>
</html>
