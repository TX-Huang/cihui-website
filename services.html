<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>服務 — 慈惠道場</title>
    <meta name="description" content="慈惠道場的服務項目與預約方式。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Noto+Sans+TC:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="pages.css" />
    <script>
      // 有 JS：段落先藏起來，捲到才慢慢浮上來（js/page.js）。
      // 保險：page.js 3 秒內沒說「好了」（檔案壞掉、沒載到），就全部直接顯示，不會一直空白
      document.documentElement.classList.add("js");
      setTimeout(function () {
        if (!window.__pageReady) document.documentElement.classList.remove("js");
      }, 3000);
    </script>
  </head>
  <body>
    <header class="topbar">
      <nav class="pill" aria-label="主選單">
        <a class="brand" href="index.html">慈惠道場</a>
        <a href="about.html">關於道場</a>
        <a href="events.html">法會活動</a>
        <a href="services.html" aria-current="page">服務</a>
      </nav>
    </header>

    <main>
      <div class="hero">
        <div class="hero-img" aria-hidden="true"></div>
        <div class="hero-text">
          <p class="eyebrow">慈惠道場</p>
          <h1>服務</h1>
          <p class="lead">道場為大家做的事</p>
        </div>
      </div>

      <div class="content">
        <section>
          <h2 class="reveal">服務項目</h2>
          <div class="todo reveal"><span class="todo-tag">待填</span>道場實際有哪些服務（例如點燈、安太歲、收驚、問事），每一項怎麼進行。</div>
        </section>

        <section>
          <h2 class="reveal">預約與聯絡</h2>
          <div class="todo reveal"><span class="todo-tag">待填</span>要不要預約、怎麼聯絡（電話、LINE）。</div>
        </section>

        <section>
          <h2 class="reveal">費用</h2>
          <div class="todo reveal"><span class="todo-tag">待填</span>要寫價錢、寫「隨喜」，或是不寫。</div>
        </section>
      </div>
    </main>

    <footer>
      <p>慈惠道場 · 主祀瑤池金母，陪祀九天玄女、中壇元帥、福德正神</p>
      <p><a href="index.html">回首頁</a></p>
    </footer>

    <script type="module" src="js/page.js"></script>
  </body>
</html>
