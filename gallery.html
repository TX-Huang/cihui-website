<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>相簿 — 慈惠道場</title>
    <meta name="description" content="慈惠道場的法會與道場照片。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Noto+Sans+TC:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body>
    <header class="topbar">
      <nav class="pill" aria-label="主選單">
        <a class="brand" href="index.html">慈惠道場</a>
        <a href="about.html">關於道場</a>
        <a href="events.html">法會活動</a>
        <a href="services.html">服務</a>
        <a href="gallery.html" aria-current="page">相簿</a>
      </nav>
    </header>

    <main>
      <div class="hero">
        <div class="hero-img" aria-hidden="true"></div>
        <div class="hero-text">
          <p class="eyebrow">慈惠道場</p>
          <h1>相簿</h1>
          <p class="lead">法會與道場的照片</p>
        </div>
      </div>

      <div class="content scroll-wrap">
        <div class="scroll" id="scroll">
          <div class="scroll-paper" id="scrollPaper" tabindex="0" aria-label="相簿畫卷，可以左右捲動">
            <div class="scroll-track" id="scrollTrack">
              <div class="scroll-empty" id="scrollEmpty">
                <div class="todo"><span class="todo-tag">待填</span>照片整理中：法會、道場的照片（一場活動一個資料夾，附上活動名稱和日期）。</div>
              </div>
            </div>
          </div>
          <span class="rod rod-right" aria-hidden="true"></span>
          <div class="rod-lane" aria-hidden="true"><span class="rod"></span></div>
        </div>
        <p class="scroll-hint" id="scrollHint">畫卷從右往左看 · 往左捲動</p>

        <dialog class="viewer" id="viewer" aria-label="看大圖">
          <figure>
            <img id="viewerImg" alt="" />
            <figcaption id="viewerCap"></figcaption>
          </figure>
          <div class="viewer-bar">
            <button type="button" id="viewerNext">← 下一張</button>
            <button type="button" id="viewerClose">關閉</button>
            <button type="button" id="viewerPrev">上一張 →</button>
          </div>
        </dialog>
      </div>
    </main>

    <footer>
      <p>慈惠道場 · 主祀瑤池金母，陪祀九天玄女、中壇元帥、福德正神</p>
      <p><a href="index.html">回首頁</a></p>
      <p class="credit">
        首頁匾額字型：<a href="https://xiaoxue.iis.sinica.edu.tw/chongxi/" target="_blank" rel="noopener">崇羲篆體</a>（中央研究院，CC BY-ND 3.0 TW）
      </p>
    </footer>

    <script type="module" src="js/page.js"></script>
    <script type="module" src="js/gallery-view.js"></script>
  </body>
</html>
