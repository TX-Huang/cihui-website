<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>法會活動 — 慈惠道場</title>
    <meta name="description" content="慈惠道場一年的神明聖誕與法會活動。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Noto+Sans+TC:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="pages.css" />
    <script>
      // 有 JS：段落先藏起來，捲到才慢慢浮上來（js/page.js）。
      // 保險：page.js 3 秒內沒說「好了」（檔案壞掉、沒載到），就全部直接顯示，不會一直空白
      document.documentElement.classList.add("js");
      setTimeout(function () {
        if (!window.__pageReady) document.documentElement.classList.remove("js");
      }, 3000);
    </script>
  </head>
  <body>
    <header class="topbar">
      <nav class="pill" aria-label="主選單">
        <a class="brand" href="index.html">慈惠道場</a>
        <a href="about.html">關於道場</a>
        <a href="events.html" aria-current="page">法會活動</a>
        <a href="services.html">服務</a>
      </nav>
    </header>

    <main>
      <div class="hero">
        <div class="hero-img" aria-hidden="true"></div>
        <div class="hero-text">
          <p class="eyebrow">慈惠道場</p>
          <h1>法會活動</h1>
          <p class="lead">一年的聖誕與法會 · 日期都是農曆</p>
        </div>
      </div>

      <div class="content">
        <section>
          <h2 class="reveal">神明聖誕</h2>
          <ul class="events" id="eventList"></ul>
          <p class="small reveal" style="margin-top: 14px">標「待確認」的日子，各地說法不一樣，等道場確認後就會拿掉。</p>
        </section>

        <section>
          <h2 class="reveal">固定活動</h2>
          <div class="todo reveal"><span class="todo-tag">待填</span>道場還有哪些固定活動（例如初一十五、禮斗、普渡、謝平安），在什麼時候。</div>
        </section>

        <section>
          <h2 class="reveal">報名方式</h2>
          <div class="todo reveal"><span class="todo-tag">待填</span>哪些活動要先報名、怎麼報名。</div>
        </section>

        <section>
          <h2 class="reveal">最新公告</h2>
          <div class="todo reveal"><span class="todo-tag">待填</span>近期的公告。</div>
        </section>
      </div>
    </main>

    <footer>
      <p>慈惠道場 · 主祀瑤池金母，陪祀九天玄女、中壇元帥、福德正神</p>
      <p><a href="index.html">回首頁</a></p>
    </footer>

    <script type="module" src="js/page.js"></script>
  </body>
</html>
