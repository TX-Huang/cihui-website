<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>光明燈登記核對與付款 — 慈惠道場</title>
    <meta name="description" content="慈惠道場光明燈：核對您家的登記資料並付款。" />
    <!-- 每戶的專屬連結（編號在 # 後面），不給搜尋引擎收錄 -->
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Noto+Sans+TC:wght@400;500&family=Yuji+Boku&family=LXGW+WenKai+TC:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body>
    <header class="topbar">
      <nav class="pill" aria-label="主選單">
        <a class="brand" href="index.html">慈惠道場</a>
        <a href="about.html">關於道場</a>
        <a href="events.html">法會活動</a>
        <a href="services.html">服務</a>
        <a href="gallery.html">相簿</a>
      </nav>
    </header>

    <main>
      <div class="hero">
        <div class="hero-img" aria-hidden="true"></div>
        <div class="hero-text">
          <p class="eyebrow">慈惠道場</p>
          <h1>光明燈登記</h1>
          <p class="lead">請核對您家的資料，確認後即可付款</p>
        </div>
      </div>

      <div class="content lamp">
        <p class="lamp-demo" id="lampDemo" hidden>試用模式：不會真的登記、也不會真的付款。</p>
        <p class="lamp-msg" id="loadMsg" role="status" aria-live="polite">讀取中…</p>

        <!-- 1. 核對資料 -->
        <section id="checkStep" hidden>
          <h2>步驟一　核對資料</h2>
          <p id="homeTitle" class="lamp-suggest-title"></p>
          <div id="people"></div>
          <div class="hh-total">
            <span>應付金額</span>
            <strong id="totalAmount"></strong>
          </div>
          <p class="small" id="jigaiNote" hidden>祭改費用另計，不含在上面的金額裡。</p>
          <div id="confirmBox">
            <p class="lamp-question">以上資料都正確嗎？</p>
            <p class="small">點選「資料正確，我同意」即表示您同意以上登記內容。</p>
            <div class="lamp-ask-bar">
              <button class="lamp-btn" id="confirmBtn" type="button">資料正確，我同意</button>
              <button class="lamp-btn lamp-btn-quiet" id="wrongBtn" type="button">資料有誤</button>
            </div>
            <p class="lamp-msg" id="wrongMsg" role="status" aria-live="polite"></p>
          </div>
          <p class="hh-done-note" id="confirmedNote" hidden>✓ 您已確認資料</p>
        </section>

        <!-- 2. 付款 -->
        <section id="payStep" hidden>
          <h2 id="payTitle" tabindex="-1">步驟二　選擇付款方式</h2>

          <div class="hh-pay">
            <h3>銀行轉帳</h3>
            <dl class="hh-bank">
              <dt>銀行</dt>
              <dd id="bankName"></dd>
              <dt>帳號</dt>
              <dd>
                <button class="hh-copy" id="copyAccount" type="button" aria-describedby="copyHint">
                  <span id="bankAccount"></span>
                  <span class="hh-copy-tag">點一下複製</span>
                </button>
              </dd>
              <dt>戶名</dt>
              <dd id="bankHolder"></dd>
              <dt>金額</dt>
              <dd>
                <button class="hh-copy" id="copyAmount" type="button">
                  <span id="payAmount"></span>
                  <span class="hh-copy-tag">點一下複製</span>
                </button>
              </dd>
            </dl>
            <p class="lamp-msg" id="copyHint" role="status" aria-live="polite"></p>
            <img class="hh-qr" id="payQr" alt="收款條碼" hidden />
            <label class="lamp-label" for="last5">轉帳後，請填您的帳號末五碼（讓樞理對帳）</label>
            <div class="lamp-hour-row">
              <input class="lamp-input" id="last5" type="text" inputmode="numeric" maxlength="5" autocomplete="off" />
              <button class="lamp-btn" id="reportBtn" type="button">我已轉帳</button>
            </div>
            <p class="lamp-msg" id="reportMsg" role="alert"></p>
          </div>

          <div class="hh-pay">
            <h3>信用卡</h3>
            <p>使用信用卡付款，金流網頁上將自動加收 <span id="cardFee">2.8%</span> 手續費（刷卡金額 <strong id="cardAmount"></strong>）。</p>
            <button class="lamp-btn" type="button" disabled>即將開放</button>
          </div>
        </section>

        <!-- 3. 付款之後 -->
        <section id="afterStep" hidden>
          <h2 id="afterTitle" tabindex="-1"></h2>
          <p id="afterText"></p>
        </section>
      </div>
    </main>

    <footer>
      <p>慈惠道場 · 主祀瑤池金母，陪祀九天玄女、中壇元帥、福德正神</p>
      <p><a href="index.html">回首頁</a></p>
    </footer>

    <script type="module" src="js/household-view.js"></script>
  </body>
</html>
