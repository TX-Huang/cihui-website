<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>慈惠道場 — 瑤池金母</title>
    <meta name="description" content="慈惠道場，主祀瑤池金母，陪祀九天玄女、中壇元帥、福德正神。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Noto+Sans+TC:wght@400;500&family=Yuji+Boku&family=LXGW+WenKai+TC:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <!-- 蟠桃樹的圖先下載：一進金母頁就要看到樹 -->
    <link rel="preload" href="assets/elements/peach-tree.webp" as="image" />
    <!-- 開場：這次造訪看過了、要求減少動畫、或直接連到其他神明，就不播（先藏起來免得閃一下） -->
    <script>
      try {
        var h = location.hash;
        if (
          sessionStorage.getItem("cihui-intro-seen") === "1" ||
          matchMedia("(prefers-reduced-motion: reduce)").matches ||
          (h && h !== "#" && h !== "#jinmu")
        )
          document.documentElement.classList.add("no-intro");
      } catch (e) {}
      // 比較用的油畫版：網址加 ?look=oil（月白油畫）或 ?look=oil-red（朱紅油畫），大門、背景、開場的雲換成油畫風
      try {
        var look = new URLSearchParams(location.search).get("look");
        if (look === "oil" || look === "oil-red") document.documentElement.dataset.look = look;
      } catch (e) {}
      // 神話開場影片（網址加 ?opening=video；跟 js/gate-opening.js 的 gateOpeningMode 一樣，測試確認）：
      // 原本的開場不播；這次造訪還沒看過、沒有要求減少動畫、沒有直接連到其他神明，就播影片
      try {
        if (new URLSearchParams(location.search).get("opening") === "video") {
          var root = document.documentElement;
          root.classList.add("no-intro");
          var seen = false;
          try {
            seen = sessionStorage.getItem("cihui-gate-opening-seen") === "1";
          } catch (e) {}
          var hash = location.hash;
          if (!seen && !matchMedia("(prefers-reduced-motion: reduce)").matches && (hash === "" || hash === "#" || hash === "#jinmu")) {
            root.dataset.opening = "video";
            // 網路慢：影片的第一格先下載
            var link = document.createElement("link");
            link.rel = "preload";
            link.as = "image";
            link.href = "assets/opening/gate-opening-first.webp";
            link.fetchPriority = "high";
            document.head.appendChild(link);
            // 程式 8 秒內都沒開始（很舊的瀏覽器、檔案載不到）：不要卡在影片畫面，直接是首頁
            setTimeout(function () {
              if (!root.dataset.gateOpeningReady) delete root.dataset.opening;
            }, 8000);
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- 開場：從凡間升入瑤池（js/intro.js 是時間軸） -->
    <div class="intro" id="intro" aria-hidden="true">
      <div class="intro-night"></div>
      <img class="intro-earth" src="assets/intro-earth.webp" alt="" />
      <img class="intro-clouds back" src="assets/intro-clouds-2.webp" alt="" />
      <img class="intro-clouds front" src="assets/intro-clouds.webp" alt="" />
      <script>
        // 油畫版：開場的三張圖換掉
        if (document.documentElement.dataset.look)
          [["intro-earth", "intro-earth"], ["intro-clouds.back", "intro-clouds-2"], ["intro-clouds.front", "intro-clouds"]].forEach(function (p) {
            document.querySelector(".intro ." + p[0]).src = "assets/oil/" + p[1] + ".webp";
          });
      </script>
      <div class="intro-veil"></div>
      <button type="button" class="intro-skip">略過</button>
    </div>
    <!-- 神話開場影片（網址加 ?opening=video）：稻田 → 湖邊的道場門 → 鳳凰飛走 → 淡成真的首頁（js/gate-opening-view.js） -->
    <div class="gate-opening" id="gateOpening">
      <video class="gate-opening-video" muted playsinline preload="auto" aria-hidden="true"></video>
      <button type="button" class="intro-skip gate-opening-skip" aria-label="略過開場影片" aria-keyshortcuts="Escape">略過</button>
    </div>

    <!-- 背景：瑤池與崑崙山（AI 畫的），加上飄動的霧 -->
    <div class="sky" aria-hidden="true">
      <div class="sky-img" id="skyImg"></div>
      <div class="mist m1"></div>
      <div class="mist m2"></div>
    </div>

    <!-- 鯉魚在拱門後面游 -->
    <canvas id="koi" class="koi" aria-hidden="true"></canvas>
    <!-- 蓮花：中壇元帥頁，點湖面開一朵（長在湖裡，所以在大門後面、鯉魚上面） -->
    <canvas class="lotus" id="lotus" aria-hidden="true"></canvas>

    <canvas id="petals" class="petals" aria-hidden="true"></canvas>
    <!-- 蟠桃樹：瑤池金母頁，站在大門右前方；點了桃花瓣飄落到宣紙上、暈開成道場 LINE 的 QR code（在花瓣上面，花瓣才不會蓋住 QR） -->
    <canvas class="peach" id="peach" aria-hidden="true"></canvas>

    <header class="topbar">
      <nav class="pill" aria-label="主選單">
        <a class="brand" href="#jinmu">慈惠道場</a>
        <a href="about.html">關於道場</a>
        <a href="events.html">法會活動</a>
        <a href="services.html">服務</a>
        <a href="gallery.html">相簿</a>
        <button type="button" class="sound-btn" id="soundBtn" aria-pressed="true">風鈴 開</button>
      </nav>
    </header>

    <div class="stage" id="stage">
      <div class="gate-wrap" id="gateWrap">
        <div class="gate" id="gate">
          <div class="door-glow" id="doorGlow"></div>
          <canvas id="cloth" aria-hidden="true"></canvas>
          <img class="gate-img" id="gateImg" src="assets/gate-dojo.webp" alt="" draggable="false" />
          <script>
            // 油畫版：大門的圖在下載前就換掉
            var look = document.documentElement.dataset.look;
            if (look) document.getElementById("gateImg").src = look === "oil-red" ? "assets/oil/gate-red.webp" : "assets/oil/gate.webp";
          </script>
          <canvas class="gate-blur" id="gateBlur" aria-hidden="true"></canvas>
          <div class="plaque" id="plaque" role="img" aria-label="慈惠道場"></div>
        </div>
      </div>

      <!-- 三青鳥：在大門前面飛、停在大門上緣（道場門的木條橫樑、油畫版廟門的屋脊）和匾額上 -->
      <canvas class="birds" id="birds" aria-hidden="true"></canvas>
      <!-- 乾坤圈、火尖槍：中壇元帥頁 -->
      <canvas class="weapons" id="weapons" aria-hidden="true"></canvas>
      <!-- 拂塵：九天玄女頁，毛隨風擺，劃過會掃出雲氣 -->
      <canvas class="fuchen" id="fuchen" aria-hidden="true"></canvas>
      <!-- 稻穗和虎爺：福德正神頁 -->
      <canvas class="tudi" id="tudi" aria-hidden="true"></canvas>

      <div class="copy" id="copy">
        <div class="heading">
          <p class="eyebrow" id="eyebrow"></p>
          <h1 class="title" id="title"></h1>
          <p class="subtitle" id="subtitle"></p>
        </div>
        <div class="aside">
          <p id="aside"></p>
          <p class="hint">滑過珠簾聽風鈴 · 按住可以拉動</p>
        </div>
      </div>

      <nav class="rail" id="rail" aria-label="神明"></nav>

      <div class="scroll-cue" id="scrollCue" aria-hidden="true">
        <span>往下滑 · 走進門</span>
        <i></i>
      </div>
    </div>

    <!-- 蟠桃樹下的一行字：點了也會變成 QR；QR 出來時旁邊有「打開 LINE」（手機掃不了自己的螢幕） -->
    <div class="peach-ui" id="peachUi">
      <button type="button" class="peach-hint" id="peachHint" aria-expanded="false">點蟠桃樹 · 道場 LINE</button>
      <a class="peach-link" id="peachLink" href="#" target="_blank" rel="noopener" style="visibility: hidden">打開 LINE →</a>
    </div>

    <!-- 匾額字型（崇羲篆體）的授權標示放在內頁的頁尾（about / events / services.html），首頁畫面不放 -->

    <!-- 看不見的捲動區：每一格 = 一位神明 -->
    <main class="scroller" id="scroller"></main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
